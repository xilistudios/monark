name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Web and Rust tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.1.30"
          cache: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run web tests
        run: bun run test:run

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # tauri::generate_context!() panics at compile time when the `frontendDist`
      # path (../dist) does not exist, and dist/ is gitignored. The tests never
      # load the real bundle, so a one-line placeholder is enough; building the
      # real frontend here would only widen the scope of this workflow.
      - name: Provide a placeholder frontend dist
        run: mkdir -p dist && printf '<!doctype html>\n' > dist/index.html

      - name: Run Rust tests
        run: bun run test:rust
