[package]
name = "monark"
version = "0.2.3"
description = "Password Manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "monark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.8", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.2.1"
tauri-plugin-store = "2.2.0"
tauri-plugin-clipboard-manager = "2.2.2"
tauri-plugin-deep-link = "2.2.1"
tauri-plugin-updater = "2"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10.1" }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
thiserror = "1"
chrono = { version = "0.4.41", features = ["serde"] }
tempfile = "3"
tokio = { version = "1.47.1", features = ["test-util"] }
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-biometry = "0.2"
tauri-plugin-http = { version = "2", features = ["multipart"] }
async-trait = "0.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "multipart", "rustls-tls", "gzip", "stream"] }
url = "2.5"
dirs = "5.0"
urlencoding = "2.1"
quick-xml = { version = "0.36", features = ["serialize"] }
# WebAuthn passkey core (T02): ES256 signing/verification + CBOR (COSE_Key,
# attestationObject). `ecdsa` enables the signing/verifying traits on P-256;
# `rand_core 0.6` is already in the lockfile via `rand 0.8`, so no version split.
p256 = { version = "0.13", features = ["ecdsa"] }
ciborium = "0.2"
# ASN.1 readers for the PKCS#8 / RFC 5915 layers of an imported ES256 key (T02):
# `pkcs8` is the trait crate p256 re-exports, `sec1` reads the `ECPrivateKey`
# inside it. Both are already in the lockfile through p256 (no new transitive
# dependency); `sec1` is listed directly because `elliptic-curve` enables it
# without its `der` feature, so the `ECPrivateKey` type is not reachable
# through the `p256` re-export.
pkcs8 = "0.10"
sec1 = "0.7"

[dev-dependencies]
mockito = "1"
# In-memory credential store used to keep tests away from the real OS keychain.
# Resolves to the same 1.0.0 the `keyring` crate already depends on, so no extra
# copy ends up in the lockfile.
keyring-core = "1"

# Keychain backends — platform-specific via keyring v4.
# v1 feature = backward-compatible Entry API (same as v3)
# Included backends: apple-native (macOS+iOS Keychain), windows-native, zbus-secret-service (Linux)
# android-native-keyring-store = Android Keystore + encrypted SharedPreferences
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "4", features = ["v1"] }

[target.'cfg(target_os = "android")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "android-native-keyring-store"] }
keyring-core = "1"
android-native-keyring-store = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.2.0"

# Linux-only: FreeDesktop settings portal (system color scheme) for the
# theme-aware tray icon. zbus 5.x is already in the lockfile (keyring/ashpd),
# so this adds no new crate versions.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
