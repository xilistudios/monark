[package]
name = "monark"
version = "0.2.0"
description = "Password Manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "monark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.8", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.2.1"
tauri-plugin-store = "2.2.0"
tauri-plugin-clipboard-manager = "2.2.2"
tauri-plugin-deep-link = "2.2.1"
tauri-plugin-updater = "2"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10.1" }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
thiserror = "1"
chrono = { version = "0.4.41", features = ["serde"] }
tempfile = "3"
tokio = { version = "1.47.1", features = ["test-util"] }
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-biometry = "0.2"
tauri-plugin-http = { version = "2", features = ["multipart"] }
async-trait = "0.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "multipart", "rustls-tls", "gzip", "stream"] }
url = "2.5"
dirs = "5.0"
urlencoding = "2.1"
quick-xml = { version = "0.36", features = ["serialize"] }

[dev-dependencies]
mockito = "1"

# Keychain backends — platform-specific via keyring v4.
# v1 feature = backward-compatible Entry API (same as v3)
# Included backends: apple-native (macOS+iOS Keychain), windows-native, zbus-secret-service (Linux)
# android-native-keyring-store = Android Keystore + encrypted SharedPreferences
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "4", features = ["v1"] }

[target.'cfg(target_os = "android")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "android-native-keyring-store"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.2.0"
